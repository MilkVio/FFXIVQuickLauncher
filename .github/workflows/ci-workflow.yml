name: Build XIVLauncher

on:
  push:
    branches:
      - Violet
    tags:
      - '*'
  pull_request:
    branches:
      - Violet
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build Release on Windows
    runs-on: windows-latest
    if: "startsWith(github.ref, 'refs/tags/')"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Initialize Submodules
        run: git submodule update --init --recursive

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore Nuget Packages
        run: |
          cd .\src\
          dotnet restore
          cd ..

      - name: Define VERSION
        run: |
          $env:COMMIT = $env:GITHUB_SHA.Substring(0, 7)
          $env:REPO_NAME = $env:GITHUB_REPOSITORY -replace '.*/'
          $env:BRANCH = $env:GITHUB_REF -replace '.*/'

          ($env:REPO_NAME) >> VERSION
          ($env:BRANCH) >> VERSION
          ($env:COMMIT) >> VERSION

      - name: Build Release
        run: |
          cd .\src\
          dotnet build XIVLauncher.slnx -c Release

      - name: Generate Hashes File
        run: .\scripts\CreateHashList.ps1 .\src\bin\win-x64

      - name: Velopack Build and GitHub Release
        id: build-velopack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $refver = $env:GITHUB_REF -replace '.*/'
          echo "version=$refver" >> $env:GITHUB_OUTPUT

          cd src\
          .\..\scripts\ci-github-release.ps1

  build:
    name: Build on Windows
    runs-on: windows-latest
    if: "!startsWith(github.ref, 'refs/tags/')"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Initialize Submodules
        run: git submodule update --init --recursive
      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          
      - name: Restore Nuget Packages
        run: |
          cd .\src\
          dotnet restore
          cd ..

      - name: Define VERSION
        run: |
          $env:COMMIT = $env:GITHUB_SHA.Substring(0, 7)
          $env:REPO_NAME = $env:GITHUB_REPOSITORY -replace '.*/'
          $env:BRANCH = $env:GITHUB_REF -replace '.*/'

          ($env:REPO_NAME) >> VERSION
          ($env:BRANCH) >> VERSION
          ($env:COMMIT) >> VERSION

      - name: Build Release
        run: |
          cd .\src\
          dotnet build XIVLauncher.slnx -c ReleaseNoUpdate

      - name: Generate Hashes File
        run: .\scripts\CreateHashList.ps1 .\src\bin

      - name: Upload artifact
        uses: actions/upload-artifact@master
        with:
          name: xivlauncher-artifact
          path: src\bin\
